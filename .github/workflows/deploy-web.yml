name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set base path for GitHub Pages
        run: |
          BASE_PATH="${{ steps.pages.outputs.base_path }}"
          echo "Detected base path: $BASE_PATH"
          jq --arg bp "$BASE_PATH" '.expo.experiments.baseUrl = $bp' app.json > app.json.tmp
          mv app.json.tmp app.json
          cat app.json | jq '.expo.experiments'

      - name: Export web build
        run: npx expo export -p web

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: SPA fallback for client-side routing
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
