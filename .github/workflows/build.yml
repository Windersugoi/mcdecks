name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android
        run: npx expo prebuild --platform android --non-interactive

      - name: Restore keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | grep -v '^-----' | tr -d '[:space:]' | base64 -d > android/app/release.keystore
          keytool -list -keystore android/app/release.keystore -storepass "$KEYSTORE_PASSWORD" > /dev/null || {
            echo "::error::El keystore restaurado no es válido. Revisa el secreto KEYSTORE_BASE64 (¿tiene cabeceras -----BEGIN/END----- de certutil? ¿está completo?) y que KEYSTORE_PASSWORD sea correcto."
            exit 1
          }

      - name: Configure signing
        run: |
          cat >> android/app/build.gradle << 'GRADLE'

          android.signingConfigs {
            release {
              storeFile file("release.keystore")
              storePassword System.getenv("KEYSTORE_PASSWORD")
              keyAlias System.getenv("KEY_ALIAS")
              keyPassword System.getenv("KEY_PASSWORD")
            }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          GRADLE

      - name: Build Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Find APK
        run: |
          APK=$(find android -name "*.apk" | head -1)
          echo "APK: $APK"
          cp "$APK" mcdecks.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mcdecks-apk
          path: mcdecks.apk
          retention-days: 30
